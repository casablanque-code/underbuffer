name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unit tests
        run: make test

      - name: Stress tests (threads + alloc/free churn)
        run: make stress

      - name: Stress tests under Valgrind
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq valgrind
          UB_STRESS_LIGHT=1 valgrind --error-exitcode=1 --leak-check=full ./build/stress_test

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Install mingw-w64
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mingw-w64

      - name: Build underbuffer.exe
        run: make

      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: underbuffer-windows
          path: build/underbuffer.exe
          if-no-files-found: error
