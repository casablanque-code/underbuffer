name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Unit tests
        run: make test

      - name: Stress tests
        run: make stress

      - name: Stress tests under Valgrind
        timeout-minutes: 5
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -qq -o Acquire::Retries=3
          sudo apt-get install -y -qq valgrind
          UB_STRESS_LIGHT=1 valgrind --error-exitcode=1 --leak-check=full ./build/stress_test

  release:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install mingw-w64
        timeout-minutes: 5
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -qq -o Acquire::Retries=3
          sudo apt-get install -y -qq mingw-w64

      - name: Build underbuffer.exe
        run: make

      - name: Prepare release assets
        run: cp build/underbuffer.exe "build/underbuffer-${GITHUB_REF_NAME}.exe"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: underbuffer-windows
          path: build/underbuffer.exe
          if-no-files-found: error

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease_flag=""
          case "${GITHUB_REF_NAME}" in
            *-*) prerelease_flag="--prerelease" ;;
          esac
          gh release create "${GITHUB_REF_NAME}" \
            build/underbuffer.exe \
            "build/underbuffer-${GITHUB_REF_NAME}.exe" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            ${prerelease_flag}
